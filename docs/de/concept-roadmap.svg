<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 598" width="760" height="598" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <title>Roadmap: sechs Phasen mit je einem Gate</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker></defs>
  <rect width="760" height="598" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#1f2328" text-anchor="start">Roadmap: sechs Phasen mit je einem Gate</text>
  <text x="520" y="28" font-size="13" font-weight="bold" fill="#59636e" text-anchor="start">Gate</text>
  <rect x="20" y="46" width="470" height="76" rx="8" fill="#ffffff" stroke="#b8bcc2" stroke-width="1.2"/>
  <text x="32" y="68" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="start">Phase 0 · Spezifikation</text>
  <text x="32" y="87" font-size="12" font-weight="normal" fill="#59636e" text-anchor="start">Rollen, Protokoll, Freigabeklassen, Bedrohungsmodell</text>
  <text x="32" y="104" font-size="12" font-weight="normal" fill="#59636e" text-anchor="start">Messplan: Einzelmodell gegen Schwarm</text>
  <text x="478" y="68" font-size="12" font-weight="bold" fill="#2e7d32" text-anchor="end">erledigt</text>
  <line x1="255" y1="122" x2="255" y2="136" stroke="#59636e" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M506,76 L514,84 L506,92 L498,84 z" fill="#2e7d32" stroke="#2e7d32" stroke-width="1.5"/>
  <line x1="490" y1="84" x2="498" y2="84" stroke="#b8bcc2" stroke-width="1.2"/>
  <text x="522" y="79" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Spezifikation versioniert,</text>
  <text x="522" y="96" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Testfälle und Bedrohungsmodell</text>
  <rect x="20" y="138" width="470" height="76" rx="8" fill="#ffffff" stroke="#b8bcc2" stroke-width="1.2"/>
  <text x="32" y="160" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="start">Phase 1 · Lokaler Schwarm</text>
  <text x="32" y="179" font-size="12" font-weight="normal" fill="#59636e" text-anchor="start">mDNS, statische Peers, OpenAI-Backends, REM</text>
  <text x="32" y="196" font-size="12" font-weight="normal" fill="#59636e" text-anchor="start">Muster mit Prüfer, Quittungen</text>
  <text x="478" y="160" font-size="12" font-weight="bold" fill="#2e7d32" text-anchor="end">erledigt</text>
  <line x1="255" y1="214" x2="255" y2="228" stroke="#59636e" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M506,168 L514,176 L506,184 L498,176 z" fill="#2e7d32" stroke="#2e7d32" stroke-width="1.5"/>
  <line x1="490" y1="176" x2="498" y2="176" stroke="#b8bcc2" stroke-width="1.2"/>
  <text x="522" y="171" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">zwei Modelle je Auftrag,</text>
  <text x="522" y="188" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Peer-Ausfall blockiert nicht</text>
  <rect x="20" y="230" width="470" height="76" rx="8" fill="#ffffff" stroke="#b8bcc2" stroke-width="1.2"/>
  <text x="32" y="252" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="start">Phase 2 · P2P-Schicht</text>
  <text x="32" y="271" font-size="12" font-weight="normal" fill="#59636e" text-anchor="start">DHT, Einstiegsquellen, AutoNAT, Hole Punching, Relay</text>
  <text x="32" y="288" font-size="12" font-weight="normal" fill="#59636e" text-anchor="start">private, Gruppen- und offene Netze (Linux)</text>
  <text x="478" y="252" font-size="12" font-weight="bold" fill="#2e7d32" text-anchor="end">erledigt</text>
  <line x1="255" y1="306" x2="255" y2="320" stroke="#59636e" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M506,260 L514,268 L506,276 L498,268 z" fill="#2e7d32" stroke="#2e7d32" stroke-width="1.5"/>
  <line x1="490" y1="268" x2="498" y2="268" stroke="#b8bcc2" stroke-width="1.2"/>
  <text x="522" y="263" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Beitritt ohne Peer-ID-Eingabe,</text>
  <text x="522" y="280" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">NAT ohne Portfreigabe</text>
  <rect x="20" y="322" width="470" height="76" rx="8" fill="#dbe8f7" stroke="#2f6fbf" stroke-width="1.8"/>
  <text x="32" y="344" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="start">Phase 3 · Selbstorganisierte Kooperation</text>
  <text x="32" y="363" font-size="12" font-weight="normal" fill="#59636e" text-anchor="start">Kompetenzprofil, Bandit über Rezepte, PI-Regler</text>
  <text x="32" y="380" font-size="12" font-weight="normal" fill="#59636e" text-anchor="start">Kaskade, Task-Graph, Lease-Koordinator</text>
  <text x="478" y="344" font-size="12" font-weight="bold" fill="#2f6fbf" text-anchor="end">als Nächstes</text>
  <line x1="255" y1="398" x2="255" y2="412" stroke="#59636e" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M506,352 L514,360 L506,368 L498,360 z" fill="#2f6fbf" stroke="#2f6fbf" stroke-width="1.5"/>
  <line x1="490" y1="360" x2="498" y2="360" stroke="#b8bcc2" stroke-width="1.2"/>
  <text x="522" y="355" font-size="12" font-weight="bold" fill="#1f2328" text-anchor="start">schlägt das beste Einzelmodell</text>
  <text x="522" y="372" font-size="12" font-weight="bold" fill="#1f2328" text-anchor="start">bei gleichem Budget</text>
  <rect x="20" y="414" width="470" height="76" rx="8" fill="#ffffff" stroke="#b8bcc2" stroke-width="1.2"/>
  <text x="32" y="436" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="start">Phase 4 · Offenes Netz für alle</text>
  <text x="32" y="455" font-size="12" font-weight="normal" fill="#59636e" text-anchor="start">Ein-Klick-Client, macOS, Windows, Kredit</text>
  <text x="32" y="472" font-size="12" font-weight="normal" fill="#59636e" text-anchor="start">Sandbox-Audit, PV-Anbindung, mehrere Startknoten</text>
  <text x="478" y="436" font-size="12" font-weight="bold" fill="#8a8f96" text-anchor="end">offen</text>
  <line x1="255" y1="490" x2="255" y2="504" stroke="#59636e" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M506,444 L514,452 L506,460 L498,452 z" fill="#ffffff" stroke="#8a8f96" stroke-width="1.5"/>
  <line x1="490" y1="452" x2="498" y2="452" stroke="#b8bcc2" stroke-width="1.2"/>
  <text x="522" y="447" font-size="12" font-weight="normal" fill="#59636e" text-anchor="start">Beitritt ohne Account,</text>
  <text x="522" y="464" font-size="12" font-weight="normal" fill="#59636e" text-anchor="start">Grenzen halten unter Last</text>
  <rect x="20" y="506" width="470" height="76" rx="8" fill="#ffffff" stroke="#b8bcc2" stroke-width="1.2"/>
  <text x="32" y="528" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="start">Phase 5 · Forschung</text>
  <text x="32" y="547" font-size="12" font-weight="normal" fill="#59636e" text-anchor="start">Layer-Sharding großer Modelle, verteiltes Training</text>
  <text x="32" y="564" font-size="12" font-weight="normal" fill="#59636e" text-anchor="start">gemeinsamer Wissensspeicher</text>
  <text x="478" y="528" font-size="12" font-weight="bold" fill="#8a8f96" text-anchor="end">offen</text>
  <path d="M506,536 L514,544 L506,552 L498,544 z" fill="#ffffff" stroke="#8a8f96" stroke-width="1.5"/>
  <line x1="490" y1="544" x2="498" y2="544" stroke="#b8bcc2" stroke-width="1.2"/>
  <text x="522" y="539" font-size="12" font-weight="normal" fill="#59636e" text-anchor="start">eigene Experimente, keine</text>
  <text x="522" y="556" font-size="12" font-weight="normal" fill="#59636e" text-anchor="start">Voraussetzung für das offene Netz</text>
</svg>
