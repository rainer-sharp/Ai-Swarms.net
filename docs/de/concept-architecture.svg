<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 436" width="850" height="436" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <title>Architektur: Ein Knoten koordiniert lokal und holt Spezialisten aus dem Netz</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker></defs>
  <rect width="850" height="436" fill="#ffffff"/>
  <rect x="20" y="16" width="300" height="56" rx="8" fill="#ffffff" stroke="#b8bcc2" stroke-width="1.2"/>
  <text x="32" y="38" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="start">Nutzer und Anwendungen</text>
  <text x="32" y="57" font-size="12" font-weight="normal" fill="#59636e" text-anchor="start">Open WebUI, IDE, Coding-Agenten</text>
  <rect x="20" y="96" width="570" height="232" rx="10" fill="#f3f4f6" stroke="#b8bcc2"/>
  <text x="576" y="118" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="end">Eigener AI-Swarms.net-Knoten</text>
  <rect x="34" y="130" width="174" height="82" rx="8" fill="#ffffff" stroke="#b8bcc2" stroke-width="1.2"/>
  <text x="46" y="152" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="start">Gateway</text>
  <text x="46" y="171" font-size="12" font-weight="normal" fill="#59636e" text-anchor="start">OpenAI-API, nur localhost</text>
  <text x="46" y="188" font-size="12" font-weight="normal" fill="#59636e" text-anchor="start">Web-Oberfläche, Status</text>
  <rect x="218" y="130" width="174" height="82" rx="8" fill="#ffffff" stroke="#b8bcc2" stroke-width="1.2"/>
  <text x="230" y="152" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="start">Auswahl</text>
  <text x="230" y="171" font-size="12" font-weight="normal" fill="#59636e" text-anchor="start">Regeln, Lastverteilung</text>
  <text x="230" y="188" font-size="12" font-weight="normal" fill="#59636e" text-anchor="start">Bandit, PI-Regler (Phase 3)</text>
  <rect x="402" y="130" width="174" height="82" rx="8" fill="#ffffff" stroke="#b8bcc2" stroke-width="1.2"/>
  <text x="414" y="152" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="start">Vertrauen</text>
  <text x="414" y="171" font-size="12" font-weight="normal" fill="#59636e" text-anchor="start">Quittungen, Zertifikate</text>
  <text x="414" y="188" font-size="12" font-weight="normal" fill="#59636e" text-anchor="start">Kredit (Phase 4)</text>
  <rect x="34" y="226" width="174" height="82" rx="8" fill="#ffffff" stroke="#b8bcc2" stroke-width="1.2"/>
  <text x="46" y="248" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="start">Ressourcen (REM)</text>
  <text x="46" y="267" font-size="12" font-weight="normal" fill="#59636e" text-anchor="start">Zeit, Last, PV</text>
  <text x="46" y="284" font-size="12" font-weight="normal" fill="#59636e" text-anchor="start">lokale Grenzen</text>
  <rect x="218" y="226" width="174" height="82" rx="8" fill="#dbe8f7" stroke="#2f6fbf" stroke-width="1.8"/>
  <text x="230" y="248" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="start">Orchestrierung</text>
  <text x="230" y="267" font-size="12" font-weight="normal" fill="#59636e" text-anchor="start">Muster, Prüfer</text>
  <text x="230" y="284" font-size="12" font-weight="normal" fill="#59636e" text-anchor="start">Synthese</text>
  <rect x="402" y="226" width="174" height="82" rx="8" fill="#ffffff" stroke="#b8bcc2" stroke-width="1.2"/>
  <text x="414" y="248" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="start">P2P-Transport</text>
  <text x="414" y="267" font-size="12" font-weight="normal" fill="#59636e" text-anchor="start">libp2p, QUIC/TCP, NAT</text>
  <text x="414" y="284" font-size="12" font-weight="normal" fill="#59636e" text-anchor="start">Relay, 3 Netzarten</text>
